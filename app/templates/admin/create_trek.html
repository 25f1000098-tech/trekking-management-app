{% extends "base.html" %}
{% block title %}Create Trek{% endblock %}
{% block content %}
<div class="card">
    <h1>Create New Trek</h1>
    <form method="POST">
        <label for="name">Trek Name</label>
        <input type="text" id="name" name="name" required>

        <label for="difficulty">Difficulty</label>
        <select id="difficulty" name="difficulty" required>
            <option value="Easy">Easy</option>
            <option value="Moderate">Moderate</option>
            <option value="Hard">Hard</option>
        </select>

        <label for="duration_days">Duration (days)</label>
        <input type="number" id="duration_days" name="duration_days" min="1" required>

        <label for="location">Location</label>
        <input type="text" id="location" name="location" required>

        <label for="available_slots">Available Slots</label>
        <input type="number" id="available_slots" name="available_slots" min="1" required>

        <button type="submit">Create Trek</button>
    </form>
    <p><a href="{{ url_for('admin.dashboard') }}">Back to Dashboard</a></p>
</div>
{% endblock %}
