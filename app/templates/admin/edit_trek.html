{% extends "base.html" %}
{% block title %}Edit Trek{% endblock %}
{% block content %}
    <h1>Edit Trek: {{ trek.name }}</h1>
    <form method="POST">
        <label for="name">Trek Name</label>
        <input type="text" id="name" name="name" value="{{ trek.name }}" required>

        <label for="difficulty">Difficulty</label>
        <select id="difficulty" name="difficulty" required>
            <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
            <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
            <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
        </select>

        <label for="duration_days">Duration (days)</label>
        <input type="number" id="duration_days" name="duration_days" value="{{ trek.duration_days }}" min="1" required>

        <label for="location">Location</label>
        <input type="text" id="location" name="location" value="{{ trek.location }}" required>

        <label for="available_slots">Available Slots</label>
        <input type="number" id="available_slots" name="available_slots" value="{{ trek.available_slots }}" min="0" required>

        <label for="status">Status</label>
        <select id="status" name="status" required>
            {% for s in ['Pending', 'Approved', 'Open', 'Closed', 'Completed'] %}
                <option value="{{ s }}" {% if trek.status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>

        <label for="staff_id">Assign Staff</label>
        <select id="staff_id" name="staff_id">
            <option value="">-- None --</option>
            {% for staff in all_staff %}
                <option value="{{ staff.id }}" {% if trek.staff_id == staff.id %}selected{% endif %}>
                    {{ staff.user.username }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Save Changes</button>
    </form>
    <p><a href="{{ url_for('admin.list_treks') }}">Back to Treks</a></p>
{% endblock %}
